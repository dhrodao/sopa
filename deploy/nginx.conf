# HTTP (80) just redirects to HTTPS. cloudflared connects to 443.
server {
    listen       80;
    server_name  _;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    http2        on;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Cloudflare Origin CA certificate (mounted as a read-only volume).
    ssl_certificate      /etc/nginx/certs/origin.pem;
    ssl_certificate_key  /etc/nginx/certs/origin.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    # Serve precompressed-friendly text types with gzip.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript image/svg+xml application/json text/markdown;
    gzip_vary         on;

    # Basic security headers (static site, no inline secrets).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # HTML must not be cached aggressively so updates show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Long cache for static assets (they are small and change with deploys).
    location ~* \.(?:css|js|svg|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Lightweight health endpoint for the container/tunnel.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
