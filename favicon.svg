<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gota de combustible">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark tile matching the app background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0f1a"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#273049"/>

  <!-- Fuel drop -->
  <path d="M32 12
           C 40 24, 48 31, 48 40
           a 16 16 0 0 1 -32 0
           C 16 31, 24 24, 32 12 Z"
        fill="url(#drop)"/>
  <!-- Highlight on the drop -->
  <ellipse cx="26" cy="38" rx="4.5" ry="6.5" fill="#ffffff" opacity="0.28"/>

  <!-- Upward trend line (forecast motif) -->
  <polyline points="20,44 27,39 33,42 44,30"
            fill="none" stroke="url(#trend)" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="30" r="3" fill="#fbbf24"/>
</svg>
