services:
  # Serves the static app over plain HTTP. TLS is terminated by Cloudflare; the
  # Cloudflare Tunnel connector runs on a separate host and reaches this
  # container over the LAN on host port WEB_PORT (default 8080).
  web:
    build: .
    image: sopa-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
